<!DOCTYPE html>
<html>
<head>
    <title>Candidate Verification</title>
</head>
<body>

    <h1>Candidate Verification</h1>

    <p>Enter Verification ID or Short Code:</p>

    <input type="text" id="code" placeholder="e.g. NTV-2026-0002 or zjmm6bb">

    <button onclick="viewProfile()">View Profile</button>

    <script>
function viewProfile() {
    const code = document.getElementById("code").value.trim();

    if (!code) {
        document.getElementById("message").textContent =
            "Enter your Verification ID or Short Code.";
        return;
    }

    window.location.href =
        "profile.html?code=" + encodeURIComponent(code);
}
    </script>

</body>
</html>
